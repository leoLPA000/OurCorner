    <script>
        // Cargar y mostrar mensajes personalizados desde Supabase
        async function cargarMensajesPersonalizados() {
            const contenedor = document.getElementById('mensajesPersonalizados');
            const filtro = document.getElementById('filtroCategoria').value;

            try {
                // Verificar que Supabase esté inicializado
                if (!window.supabaseClient) {
                    console.error('❌ Supabase no está inicializado');
                    contenedor.innerHTML = `
                        <div class="mensaje-vacio-grande">
                            <div class="icono-vacio">⚠️</div>
                            <h3>Error de conexión</h3>
                            <p>No se pudo conectar a Supabase. Verifica tu conexión.</p>
                        </div>
                    `;
                    return;
                }

                // Cargar mensajes desde Supabase
                const { data: mensajes, error } = await window.supabaseClient
                    .from('mensajes')
                    .select('*')
                    .order('creado_en', { ascending: false });

                if (error) {
                    console.error('❌ Error al cargar mensajes:', error);
                    throw error;
                }

                appLog('✅ Mensajes cargados desde Supabase:', mensajes.length);

                // Filtrar mensajes si es necesario
                const mensajesFiltrados = filtro === 'todas'
                    ? mensajes
                    : mensajes.filter(m => m.categoria === filtro);

                if (mensajesFiltrados.length === 0) {
                    contenedor.innerHTML = `
                        <div class="mensaje-vacio-grande">
                            <div class="icono-vacio">✍️</div>
                            <h3>No hay mensajes aquí todavía</h3>
                            <p>Usa el botón "Agregar Mensaje" para crear tu primer mensaje personalizado</p>
                            <button onclick="document.querySelector('.btn-formulario').click()" class="btn-crear-primero">
                                ✍️ Crear mi primer mensaje
                            </button>
                        </div>
                    `;
                    return;
                }

                contenedor.innerHTML = mensajesFiltrados.map(mensaje => {
                    // Formatear la fecha
                    const fecha = new Date(mensaje.creado_en).toLocaleDateString('es-ES', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });

                    return `
                        <article class="mensaje-card mensaje-personalizado" data-id="${mensaje.id}">
                            <div class="mensaje-header-personalizado">
                                <span class="emoji-grande">${mensaje.emoji || '💕'}</span>
                                <span class="badge-personalizado">Tu mensaje</span>
                            </div>
                            <p class="mensaje-texto">${escapeHtml(mensaje.texto)}</p>
                            ${mensaje.nota ? `<p class="mensaje-nota-personalizado">📝 ${escapeHtml(mensaje.nota)}</p>` : ''}
                            <div class="mensaje-footer-personalizado">
                                <span class="mensaje-firma">— ${escapeHtml(mensaje.autor || 'Anónimo')}</span>
                                <span class="mensaje-fecha-creacion">${fecha}</span>
                            </div>
                        </article>
                    `;
                }).join('');



                // Montar botones de reacciones para cada tarjeta.
                // Antes se hacían ~4 consultas a Supabase POR CADA mensaje (conteos,
                // mi reacción, y permisos dos veces) — con muchos mensajes eso son
                // cientos de peticiones simultáneas y la página se sentía lenta.
                // Ahora se resuelve todo en un puñado de consultas, una sola vez.
                appLog('🔍 Buscando tarjetas de mensajes...');

                if (!window.Reacciones) {
                    console.error('❌ window.Reacciones no está disponible');
                } else {
                    const articles = Array.from(document.querySelectorAll('.mensaje-personalizado'));
                    const mensajeIds = articles.map(a => a.dataset.id).filter(Boolean);

                    const [{ conteos, misReacciones }, puedeModificar] = await Promise.all([
                        window.Reacciones.obtenerReaccionesDeMensajes(mensajeIds),
                        window.rolesService ? window.rolesService.canModify() : Promise.resolve(false)
                    ]);

                    articles.forEach(article => {
                        const mensajeId = article.dataset.id;
                        if (!mensajeId) {
                            console.warn('❌ Tarjeta sin ID:', article);
                            return;
                        }

                        // Contenedor para los botones
                        let wrapper = article.querySelector('.reacciones-wrapper');
                        if (!wrapper) {
                            wrapper = document.createElement('div');
                            wrapper.className = 'reacciones-wrapper';
                            article.appendChild(wrapper);
                        }

                        window.Reacciones.montarBotonesDeReaccion(
                            wrapper,
                            mensajeId,
                            conteos[mensajeId] || {},
                            misReacciones[mensajeId] || null,
                            puedeModificar
                        );

                        // 🔐 Solo mostrar botón de eliminar si tiene permisos
                        if (puedeModificar) {
                            const btnEliminar = document.createElement('button');
                            btnEliminar.className = 'btn-eliminar-mensaje-vista';
                            btnEliminar.dataset.id = mensajeId;
                            btnEliminar.title = 'Eliminar mensaje';
                            btnEliminar.innerHTML = '🗑️ Eliminar';
                            btnEliminar.addEventListener('click', () => eliminarMensajeVista(mensajeId));
                            wrapper.appendChild(btnEliminar);
                        }
                    });

                    appLog(`✅ Reacciones y permisos resueltos para ${mensajeIds.length} mensajes en lote`);
                }

                // Suscripción en tiempo real para actualizar cuando cambien
                if (window.Reacciones && window.Reacciones.suscribirReacciones) {
                    const subscription = window.Reacciones.suscribirReacciones(async ({ mensajeId }) => {
                        if (!mensajeId) return;
                        
                        appLog('🔔 Cambio en tiempo real detectado para:', mensajeId);
                        
                        const card = document.querySelector(`.mensaje-personalizado[data-id="${mensajeId}"]`);
                        if (!card) {
                            console.warn('⚠️ Tarjeta no encontrada para', mensajeId);
                            return;
                        }

                        const btnPrincipal = card.querySelector('.btn-reaction-main');
                        const resumen = card.querySelector('.reaction-summary');
                        if (!btnPrincipal) {
                            console.warn('⚠️ Botón principal no encontrado para', mensajeId);
                            return;
                        }

                        try {
                            // Refrescar mi propia reacción y el resumen agregado de todos los usuarios
                            // (el cambio en tiempo real puede venir de OTRA cuenta reaccionando)
                            const [emoji, counts] = await Promise.all([
                                window.Reacciones.obtenerEmojiActual(mensajeId),
                                window.Reacciones.obtenerConteosPorMensaje(mensajeId)
                            ]);
                            const hasReaction = !!emoji;

                            appLog('✅ Mi emoji actual:', emoji, '- tiene reacción:', hasReaction, '- conteos:', counts);

                            const displayEmoji = emoji || '❤️';
                            const NOMBRES_REACCION = { '😂': 'Me divierte', '❤️': 'Me encanta', '😍': 'Me fascina', '🥹': 'Me conmueve', '🫂': 'Te abrazo' };
                            const label = hasReaction ? (NOMBRES_REACCION[emoji] || 'Reaccionaste') : 'Reaccionar';

                            btnPrincipal.innerHTML = `
                                <span class="reaction-emoji">${displayEmoji}</span>
                                <span class="reaction-text">${label}</span>
                            `;
                            btnPrincipal.className = `btn-reaction-main ${hasReaction ? 'reacted' : ''}`;

                            if (resumen) {
                                const entries = Object.entries(counts || {}).filter(([, c]) => c > 0);
                                if (entries.length === 0) {
                                    resumen.innerHTML = '';
                                    resumen.classList.remove('visible');
                                } else {
                                    entries.sort((a, b) => b[1] - a[1]);
                                    const total = entries.reduce((sum, [, c]) => sum + c, 0);
                                    const iconos = entries.slice(0, 3).map(([e]) => `<span class="resumen-emoji">${e}</span>`).join('');
                                    resumen.innerHTML = `${iconos}<span class="resumen-total">${total}</span>`;
                                    resumen.classList.add('visible');
                                }
                            }

                            appLog('🔄 Botón y resumen actualizados en tiempo real');
                        } catch (err) {
                            console.error('❌ Error actualizando botón en tiempo real:', err);
                        }
                    });
                    
                    appLog('🎧 Suscripción de tiempo real activa:', subscription);
                }

            } catch (err) {
                console.error('❌ Error al cargar mensajes:', err);
                contenedor.innerHTML = `
                    <div class="mensaje-vacio-grande">
                        <div class="icono-vacio">⚠️</div>
                        <h3>Error al cargar mensajes</h3>
                        <p>${escapeHtml(err.message)}</p>
                    </div>
                `;
            }
        }

        async function eliminarMensajeVista(id) {
            // 🔐 Verificar autenticación
            if (!requireLogin('⚠️ Debes iniciar sesión para eliminar mensajes')) {
                return;
            }

            // 🔐 Verificar permisos de rol
            if (window.rolesService && !await window.rolesService.canModify()) {
                window.rolesService.showNoPermissionMessage();
                return;
            }

            if (!confirm('¿Estás segura de que quieres eliminar este mensaje?')) {
                return;
            }

            try {
                if (!window.supabaseClient) {
                    console.error('❌ Supabase no está inicializado');
                    mostrarNotificacion('Error: Supabase no inicializado', 'info');
                    return;
                }

                const { error } = await window.supabaseClient
                    .from('mensajes')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                appLog('✅ Mensaje eliminado de Supabase');

                // Recargar lista
                await cargarMensajesPersonalizados();

                // Mostrar notificación
                mostrarNotificacion('Mensaje eliminado correctamente', 'info');

            } catch (err) {
                console.error('❌ Error al eliminar mensaje:', err);
                mostrarNotificacion('Error al eliminar mensaje: ' + err.message, 'info');
            }
        }

        function mostrarNotificacion(mensaje, tipo) {
            const notificacion = document.createElement('div');
            notificacion.className = `notificacion-toast notificacion-${tipo} show`;
            notificacion.setAttribute('role', 'status');
            notificacion.setAttribute('aria-live', 'polite');
            notificacion.innerHTML = `
                <span class="notificacion-icono">${tipo === 'info' ? 'ℹ️' : '✅'}</span>
                <span class="notificacion-texto">${escapeHtml(mensaje)}</span>
            `;
            document.body.appendChild(notificacion);

            setTimeout(() => {
                notificacion.classList.remove('show');
                setTimeout(() => notificacion.remove(), 300);
            }, 3000);
        }

        // Cargar al inicio
        document.addEventListener('DOMContentLoaded', () => {
            cargarMensajesPersonalizados();

            // Evento de filtro
            document.getElementById('filtroCategoria').addEventListener('change', cargarMensajesPersonalizados);

            // Recargar cuando se guarde un nuevo mensaje
            window.addEventListener('storage', (e) => {
                if (e.key === 'mensajesPersonalizados') {
                    cargarMensajesPersonalizados();
                }
            });
        });
    </script>

        @keyframes feedbackShow {
